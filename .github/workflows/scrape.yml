name: AnimeZone Scraper

on:
  schedule:
    # Cron hebdomadaire — tous les lundis à 03:00 UTC (~05:00 Paris)
    # Évite le pic de charge de minuit (tout le monde schedule à 00:00)
    - cron: '0 3 * * 1'
  # Permet de lancer manuellement depuis l'onglet Actions
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6h max (on en utilise ~3h)
    permissions:
      contents: write  # Requis pour le git push final (commit state.json)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify HF_TOKEN is set
        # Évite de lancer le scraper pour rien si le secret est vide
        # (arrive souvent quand on oublie de créer le secret)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "❌ HF_TOKEN est vide ! Crée le secret dans Settings → Secrets → Actions"
            exit 1
          fi
          echo "✓ HF_TOKEN présent (${#HF_TOKEN} chars)"

      - name: Run scraper
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scrap.py --hf "$HF_TOKEN" --pull --push

      - name: Commit state.json back to repo (cache)
        # Optionnel : garde une copie du state dans le repo pour debug
        # Mais la source de vérité reste HuggingFace
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          if [ -f state.json ]; then
            git add state.json || true
            git commit -m "chore: update state.json [skip ci]" || true
            git push || true
          fi
